sonar.organization=carlosgomez0717
sonar.projectKey=api-rest-producto
sonar.projectName=API Rest Producto
sonar.projectVersion=1.0

# Rutas del código fuente
sonar.sources=src
sonar.tests=tests

# Configuración de cobertura de código generada por Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

# Exclusiones (archivos que no deseas analizar)
sonar.exclusions=node_modules/**,coverage/**,dist/**
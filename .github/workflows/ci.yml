name: CI/CD Pipeline - Tienda API

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test-and-quality:
    runs-on: ubuntu-latest

    # Servicio de Base de Datos PostgreSQL temporal para las pruebas de integración
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: tienda_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Instalar dependencias del proyecto
      - name: Instalar dependencias
        run: npm install

      # 4. Configurar variables de entorno para pruebas
      - name: Crear archivo .env de prueba
        run: |
          echo "PORT=3000" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_NAME=tienda_db" >> .env
          echo "DB_PASSWORD=root" >> .env
          echo "DB_PORT=5432" >> .env

      # 5. Ejecutar pruebas automáticas y generar reporte de cobertura
      - name: Ejecutar pruebas y cobertura
        run: npm test -- --coverage

      # 6. Subir reporte de calidad / cobertura como artefacto en GitHub
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

  docker-build-and-push:
    needs: test-and-quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Configurar Docker Buildx para compilaciones avanzadas
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Iniciar sesión en Docker Hub (Opcional, descomenta si deseas subir la imagen a un registro)
      # - name: Iniciar sesión en Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Construir la imagen de Docker para validar que no existan errores de empaquetado
      - name: Construir imagen Docker de la API
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Cambiar a true si configuras tus credenciales y deseas publicarla en Docker Hub
          tags: tienda-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
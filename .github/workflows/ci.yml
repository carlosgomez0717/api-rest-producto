name: CI/CD Pipeline - Tienda API

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read
  packages: write

jobs:
  test-and-quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: tienda_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Crear archivo .env de prueba
        run: |
          echo "PORT=3000" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_NAME=tienda_db" >> .env
          echo "DB_PASSWORD=root" >> .env
          echo "DB_PORT=5432" >> .env

      - name: Ejecutar pruebas y cobertura
        run: npm test
      # NUEVO: Paso de análisis de código con SonarQube
      - name: Analizar código con SonarQube
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

  docker-publish-ghcr:
    needs: test-and-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convertir el nombre del repositorio a minúsculas de forma nativa con Bash
      - name: Preparar nombre de imagen en minúsculas
        id: prep_image
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Construir y publicar imagen Docker en GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.prep_image.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
name: CI/CD Pipeline - Tienda API

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test-and-quality:
    runs-on: ubuntu-latest

    # Servicio de Base de Datos PostgreSQL temporal para las pruebas de integración y contenedores
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: tienda_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Instalar dependencias completas
      - name: Instalar dependencias
        run: npm ci

      # 4. Configurar variables de entorno para pruebas
      - name: Crear archivo .env de prueba
        run: |
          echo "PORT=3000" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_NAME=tienda_db" >> .env
          echo "DB_PASSWORD=root" >> .env
          echo "DB_PORT=5432" >> .env

      # 5. Ejecutar pruebas automáticas y generar reporte de cobertura
      - name: Ejecutar pruebas y cobertura
        run: npm test

      # 6. Subir reporte de cobertura como artefacto en GitHub
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

  docker-build-and-test:
    needs: test-and-quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: tienda_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Construir la imagen de Docker localmente en el runner de GitHub
      - name: Construir imagen Docker
        run: docker build -t tienda-api:latest .

      # 2. Ejecutar el contenedor conectándose a la base de datos de GitHub mediante la IP de puente (172.17.0.1)
      - name: Ejecutar contenedor Docker
        run: |
          docker run -d \
            -p 3000:3000 \
            --name tienda-container \
            -e PORT=3000 \
            -e DB_USER=postgres \
            -e DB_HOST=172.17.0.1 \
            -e DB_NAME=tienda_db \
            -e DB_PASSWORD=root \
            -e DB_PORT=5432 \
            tienda-api:latest

      # 3. Esperar unos segundos y verificar que la API responde exitosamente
      - name: Probar endpoints de la API en el contenedor
        run: |
          sleep 5
          curl --retry 5 --retry-delay 3 --retry-all-errors http://localhost:3000/
          curl --retry 5 --retry-delay 3 --retry-all-errors http://localhost:3000/api/products

      # 4. Mostrar los logs del contenedor en caso de que ocurra algún fallo
      - name: Ver logs del contenedor si falla
        if: failure()
        run: docker logs tienda-container